server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits hashed assets — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Clean URLs: try the file, then the directory's index.html, then 404.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
